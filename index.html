button{font:inherit;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:0 0 10px;cursor:pointer;line-height:1.6}

button.main{background:var(--acc);color:#120f1d;border-color:var(--acc);text-align:center;font-weight:700}
.win{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;min-height:11em;margin:0 0 16px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}

.cur::after{content:"▍";color:var(--acc);animation:bl 1s steps(2) infinite}

.ch{visibility:hidden;opacity:0;transition:opacity .4s}

.stage{min-height:72vh;display:flex;flex-direction:column;justify-content:center}

.recap{min-height:0;cursor:default;padding:14px;font-size:.92rem;line-height:1.75}
.fan{color:var(--mute);font-size:.78rem;line-height:1.7;margin-top:28px;word-break:keep-all}
.coll{color:var(--mute);font-size:.85rem;margin:16px 0}
</style>

var REACT={
s1:["소녀가 죽음의 손끝을 잡을 듯 말 듯 가볍게 웃는다. 처음 맛본 자유의 감각이 가슴 깊이 스며든다. 풀밭 위에 내려앉은 그녀는 눈을 반짝이며 중얼거린다. “한 번 더… 더 높이!”","소녀의 몸이 부드럽게 풀밭에 내려앉는다. 숨을 몰아쉬며 하늘을 바라보던 그녀가 중얼거린다. “누구였지? 이상하게 서늘하고 아쉬워…”","소녀는 풀밭 위에서 숨을 몰아쉬며 나지막이 읊조린다. “내 손을 놓지 마요… 곁에 머물러 줘요…” 서늘한 온기가 그녀를 감싼다."],
s2:["황제의 청혼 앞에서 소녀의 귓가가 서늘해진다. ‘마지막 춤.’ 그녀는 어둠 속 당신을 향해 희미하게 미소 짓고는 한 걸음 물러선다. “저는 아직 자유롭고 싶어요.” 무도회장이 술렁인다.","소녀는 두 손을 모은 채 오래 서 있다. 어둠 속 당신을 바라보며 미소 짓는다. 한참 뒤, 그녀는 떨리는 손으로 황제의 손을 잡는다.","청혼을 받아들이는 순간에도 그녀의 시선은 연회장의 가장 어두운 구석, 당신이 서 있는 곳에서 떨어지지 않는다. 입가에는 작은 미소가 걸려 있다."],
a1:["그녀는 낯선 시인이 건넨 시구절을 읽으며 쓸쓸하게 웃는다. “내가 사랑하는 시인의 문체와 닮았군요…” 시인은 이미 안개 속으로 사라진 뒤다.","말을 달리던 그녀가 문득 뒤를 돌아본다. 아무도 없지만, 서늘한 바람이 누군가 곁을 함께 달리는 듯한 착각을 불러일으킨다.","그녀는 혼자 들판을 가로지른다. 바람이 거세질수록 더욱 크게 웃는다. 아무도 따라올 수 없는 고독이 오히려 그녀를 단단하게 만든다."],
a2:["창문에 손을 올리자 유리 너머로 당신의 손길이 닿을 듯 다가온다. 한참 뒤 그녀는 조용히 손을 거둔다. “아직은… 아니에요.” 하지만 눈가엔 눈물이 고여 있다.","그녀는 고삐에 박인 굳은살과 오래된 편지를 내려다본다. “내가 지켜낸 것들이 아직 여기 남아 있어.”","창가의 서늘한 기척을 느끼며 그녀가 나지막이 말한다. “당신이 곁에 있으면 이상하게 외롭지 않네요.” 그리고 깊은 잠에 빠져든다."],
w:["추기경의 질문 속에서 엘리자벳이 떨리는 목소리로 “네…”라고 대답하는 순간, 오르간 소리를 뚫고 거대한 죽음의 웃음소리가 울려 퍼진다.","그녀는 시선을 돌려 당신과 마주한다. 화려한 찬가 속에서도 ‘마지막 춤’이라는 속삭임이 귓가에 맴돈다.","하객석의 어둠을 두리번거리지만 아무도 찾지 못한다. 조금 안도하면서도, 깊은 쓸쓸함이 그녀의 얼굴에 그림자를 드리운다."],
k:["그녀의 등이 곧게 펴진다. 소피 대공비의 차가운 눈빛 앞에서 그녀가 나지막이 말한다. “제 삶의 주권은 제가 갖겠어요.” 궁정의 공기가 얼어붙는다.","소피 대공비의 방 촛불이 서늘한 바람에 흔들린다. 대공비가 한기를 느끼며 손을 멈춘 틈에 엘리자벳은 숨을 돌린다.","그녀는 깊은 한숨 끝에 작은 반항을 택한다. 새벽 산책을 늘리며 자신만의 자유를 지키기 시작한다."],
h1:["빈 요람을 쓰다듬던 그녀가 고개를 든다. 당신 쪽으로 손이 반쯤 올라갔다 멈춘다. 그녀는 입술을 깨물고 손을 거둔다.","당신은 침묵 속에 곁을 지킨다. 한참을 울던 그녀가 울음이 그칠 때쯤 조용히 중얼거린다. “고마워요, 곁에 있어줘서.”","그녀는 대답 대신 밤새 촛불을 끄지 않는다. 당신이 어둠 속에 있음을 이미 알고 있는 것처럼."],
beauty:["승마와 체조에 열중하던 그녀가 거울 속에서 섬뜩한 한기를 느낀다. 하지만 이내 입술을 깨물며 삶의 주도권을 움켜쥔다.","거울에 비친 자신의 아름다움을 지켜보며 그녀는 더욱 차갑고 강인해진다. 궁전의 그 누구도 자신을 꺾을 수 없음을 다짐한다.","거울 너머 당신의 서늘한 미소와 눈이 마주친 그녀는 오만한 미소로 답한다."],
tanz:["당신이 내민 손을 바라보던 엘리자벳은 차가운 미소를 지으며 그 손을 지나쳐 버린다. 당신의 손을 잡는 대신, 그녀는 오롯이 자기 자신만의 박자로 홀 한가운데서 도도하게 춤을 시작한다.","엘리자벳이 웃는다. “그날이 오면 그때 생각할게요.” 그녀는 당신을 지나쳐 음악 속으로 걸어 들어간다.","엘리자벳은 대답 대신 당신을 한 번 돌아본 뒤 춤을 시작한다. 그녀가 어디로 움직이든 당신의 시선은 그녀를 따라간다."],
epidemic:["당신에게서 병의 정체를 들은 그녀는 절망의 비명을 지른다. 세상 모든 것에 환멸을 느낀 눈빛이 차갑게 식어간다.","떨리는 그녀의 손을 감싸 쥐자 서늘한 위로가 전달된다. 그녀는 조용히 눈을 감으며 숨을 고른다.","궁정의 추악함에 실소한 그녀는 스스로 황궁의 문을 차고 나갈 것을 결심한다."],
wander:["바람 부는 바다 위, 황후는 멀리 수평선을 바라본다. 죽음이 곁에 있음을 알면서도 그녀는 방랑을 멈추지 않는다.","휘날리는 검은 옷자락 속에서 황후는 자유를 찾기 위해 쉼 없이 걸음을 옮긴다.","황실의 모든 구속을 벗어던진 그녀의 눈빛은 그 어느 때보다 밝게 빛난다."],
r0:["어린 루돌프는 서늘하지만 이상하리만치 안온한 친구의 온기 속에서 오랜만에 잠에 든다. “친구야, 계속 내 곁에 있어줘…”","아이는 이불 속에서 숨죽여 어머니의 걸음 소리를 기다린다. 어둠만이 아이의 방를 깊게 감싼다.","엘리자벳은 불길한 예감에 아이의 방 쪽을 돌아보지만, 이미 방랑의 여정이 그녀를 기다리고 있다."],
r1_schatten:["성인이 된 루돌프의 눈빛에 아버지에 대한 반항과 권력의 욕망이 깃든다. 그는 점점 빈 궁정에서 고립되어 간다.","루돌프는 어둠 속 침묵에 고개를 숙인 채 자신의 처지를 곱씹는다.","합스부르크 왕가의 거대한 그림자가 루돌프를 천천히 집어삼킨다."],
r1:["엘리자벳은 아들의 절규에서 자신의 과거를 본다. 한순간 손이 올라가지만 곧 고개를 돌린다. “난 이미 그곳을 벗어났단다. 널 위해서라도 돌아갈 수는 없어.”","당신이 곁에서 들어 주는 동안에도 루돌프는 어머니에게서 답을 얻지 못하고 말없이 방을 나선다.","거울 속 두 사람은 서로를 향하지 못한 채 서 있다. 합스부르크 왕조가 균열하는 소리가 서늘하게 들려온다."],
r2_mayerling:["천둥과 총성이 울리던 어두운 방에서 당신을 부르던 어린아이의 목소리가 환영처럼 지나간다. 긴 세월 동안 혼자였던 그의 마지막 온기가 서늘하게 피어오른다.","루돌프의 고독한 눈빛 너머로 평생 자유를 갈망하던 엘리자벳의 그림자가 겹쳐 보인다. 그 닮은 꼴의 비극에 당신은 깊은 침묵에 빠져든다.","당신은 끝까지 곁을 떠나지 않는다. 아무도 오지 못한 그 마이얼링의 밤을 혼자 보내게 하지 않는 것, 그것이 당신이 그에게 건넨 마지막 위로였다."],
r2:["검은 상복을 입은 그녀가 무릎을 꿇는다. 허공을 헤매는 손. 당신이 차갑게 외면하자 그녀의 눈빛에 마지막 원망과 생기가 얽혀든다.","날카로운 거절이 가슴을 찌르지만, 그녀의 눈빛은 비통함 속에서 다시금 삶을 향한 분노로 살아난다.","그녀는 매달리듯 울다가 해가 뜰 무렵 깊은 침묵에 빠져든다. “그래도… 아직은 내 발로 걸어야 해.”"],
death:["그녀는 호수를 한 번 돌아보고 조용히 미소 짓는다. 줄 위에서 떨어지던 날부터 이어진 모든 순간이 스쳐 간다.","곁에 선 당신을 올려다보며 그녀가 중얼거린다. “당신 덕분에 혼자는 아니었어요.”","그녀는 어깨의 짐을 내려놓은 사람처럼 고개를 끄덕인다. “내 삶이었어요. 전부.”","그녀는 잡힌 손을 내려다보다 호수 쪽을 한 번 돌아본다. “붙잡는 손이 하나쯤은 있어도 괜찮겠죠. 하지만 내가 걸어온 길은 내 것이에요.”"],
veil:["엘리자벳은 당신의 시선에서 오래 잊었던 평온을 읽는다. ","그녀가 희미하게 웃는다. “소유할 수 있는 건 아무것도 없었어요. 내 삶조차도. 그래도 마지막 걸음은 내가 걸어왔어요.”","그녀가 처음으로 당신의 손을 따뜻하게 쥔다. 호수의 바람이 두 사람 사이를 스친다."]

var AC,MUTE=false,DRONE;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,ty,v,dl){var a=AC;if(!a||MUTE||a.state!=="running")return;var t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v,fr,dl){var a=AC;if(!a||MUTE||a.state!=="running")return;var n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(var i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type="lowpass";f.frequency.value=fr||800;g.gain.value=v||.2;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+(dl||0))}
var SFX={tick:function(){tone(320+Math.random()*50,.06,"triangle",.025)},pick:function(){au();tone(196,.25,"triangle",.06);tone(293,.3,"sine",.03,.04)},veil:function(){tone(110,1.6,"sine",.07);tone(165,1.8,"sine",.04,.1);noise(1.2,.05,400)},bell:function(){[196,294,392].forEach(function(f,i){tone(f,3,"sine",.05,i*.3)})},far:function(){noise(.5,.06,350);noise(1,.02,200,.3)}};
function drone(){var a=au();if(!a||DRONE)return;var g=a.createGain();g.gain.value=MUTE?0:.03;g.connect(a.destination);[55,82.4,110].forEach(function(f,i){var o=a.createOscillator();o.type=i?"sine":"triangle";o.frequency.value=f;o.detune.value=i*4;o.connect(g);o.start()});DRONE=g}
function mood(l){if(DRONE&&AC)DRONE.gain.setTargetAtTime(MUTE?0:l,AC.currentTime,1.2)}
var app=document.getElementById("app");
function meters(){var n=[["will","의지"],["lure","유혹"],["aff","애정"]],h='<div class="meters">';n.forEach(function(k){var v=Math.max(0,Math.min(8,S[k[0]]));h+='<div class="meter">'+k[1]+'<i><b style="width:'+(v/8*100)+'%"></b></i></div>'});return h+"</div>"}
function start(){S={will:0,lure:0,aff:0,obs:0,fight:0,rud:0};R="";historyLogs=[];
app.innerHTML='<p class="when">Der letzte Tanz — 죽음의 시선</p><h1>엘리자벳<br>죽음의 시선</h1><p class="sub">“100년이 지났소. 저승의 법정, 루케니가 당신을 증인석에 세운다.”</p><p class="txt" id="intro-tx"></p><div class="ch" id="intro-ch"><button class="main" data-go="s1">증언 시작하기</button></div><p class="fan">※ 이 게임은 상업적 목적 없이 뮤지컬 〈엘리자벳〉을 바탕으로 팬이 만든 창작물입니다. 원작과 관련된 모든 권리는 원작자 및 제작사에 있습니다.</p>';
typeIn("당신은 죽음(Tod)입니다. 황후 엘리자벳의 일생을 곁에서 지켜보며 속삭이고, 기다리고, 혹은 유혹하십시오. 당신의 선택은 그녀가 걸어가는 길과, 마지막 법정에서 당신이 내놓을 대답을 바꿔 놓습니다.",function(){document.getElementById("intro-ch").classList.add("on")})}
function historyMarkup(){if(!historyLogs.length)return "";var h='<details class="history-box"><summary>이전 선택 보기 ('+historyLogs.length+')</summary><ul>';historyLogs.forEach(function(it){h+='<li><b>['+it.when+']</b><br>'+it.choice+'</li>'});return h+'</ul></details>'}
function paragraphize(text){var sentences=text.match(/[^.!?]+[.!?]+[”’\"]?|[^.!?]+$/g)||[text];var out=[];for(var i=0;i<sentences.length;i+=2){out.push(sentences.slice(i,i+2).join(" ").trim())}return out.join("\n\n")}
function typeIn(text,done){var el=document.getElementById("tx")||document.getElementById("intro-tx"),i=0;text=paragraphize(text);FULL=text;DONE=done;
if(matchMedia("(prefers-reduced-motion: reduce)").matches){finish();return}
el.className="txt cur";TM=setInterval(function(){i+=2;el.textContent=text.slice(0,i);if(i%6===0)SFX.tick();if(i>=text.length)finish()},25)}
function finish(){clearInterval(TM);var el=document.getElementById("tx")||document.getElementById("intro-tx");if(!el)return;el.textContent=FULL;el.className="txt";if(DONE){var d=DONE;DONE=null;d()}}
var PEND;
var PG;
function splitPages(t){var s=t.match(/[^.!?]+[.!?]+[”’"]?\s*|[^.!?]+$/g)||[t],o=[],c="";s.forEach(function(x){if(c&&(c+x).length>110){o.push(c.trim());c=x}else c+=x});if(c.trim())o.push(c.trim());return o}
function showPage(){var n=PG.pages.length,last=PG.i>=n-1,pn=n>1?' · '+(PG.i+1)+'/'+n:'',btn=last?PG.btns:'<button class="main" data-pg="1">다음</button>',st=PG.mode==="stage";
app.innerHTML=(st?'<div class="stage">':meters())+'<p class="when">'+PG.w+pn+'</p><div class="win" id="win"><p class="txt" id="tx"></p></div><div class="ch" id="ch">'+btn+'</div>'+(st?'</div>':'');
window.scrollTo(0,0);typeIn(PG.pages[PG.i],function(){document.getElementById("ch").classList.add("on")})}
function render(w,t,b){clearInterval(TM);PG={w:w,pages:splitPages(t),i:0,btns:b+historyMarkup(),mode:"render"};showPage()}
function stage(w,t){clearInterval(TM);PG={w:w,pages:splitPages(t),i:0,btns:'<button class="main" data-stage="1">선택하러 가기</button>'+historyMarkup(),mode:"stage"};showPage()}
function showChoices(){clearInterval(TM);DONE=null;app.innerHTML=meters()+'<p class="when">'+PEND.w+'</p><div class="win recap"><p class="txt">'+splitPages(PEND.txt).slice(-1)[0]+'</p></div><div class="ch on">'+PEND.h+historyMarkup()+'</div>';window.scrollTo(0,0)}
function scene(id){var s=SC[id],h="",txt=typeof s.t==="function"?s.t():s.t;s.c.forEach(function(c,i){h+='<button data-id="'+id+'" data-i="'+i+'">'+c[0]+'</button>'});PEND={w:s.w,txt:txt,h:h};stage(s.w,txt);if(id==="veil")SFX.veil();if(id==="r0"){setTimeout(SFX.far,2200);setTimeout(SFX.far,4200)}if(id==="r2_mayerling")mood(.004)}
function endKey(){return R==="A"?(S.will>=4?"A1":"A2"):R==="B"?(S.fight>=5?"B1":"B2"):(S.will>=9?"C1":"C2")}
function ending(){var k=endKey();got[k]=1;SFX.bell();var e=ENDS[k],names=Object.keys(got).map(function(x){return ENDS[x][0]}).join(", ");
var hh='<div class="history-box"><h3>당신이 걸어온 증언의 기록</h3><ul>';
historyLogs.forEach(function(it){hh+='<li><b>['+it.when+']</b><br>'+it.choice+'</li>'});hh+='</ul></div>';
render("결말 — "+e[0],e[1]+" "+["루케니는 서늘한 미소를 지으며 침묵했다.","법정 안은 차가운 정적으로 채워졌다.","어둠 속에서 마지막 춤곡의 여운이 울려 퍼졌다."][last],hh+'<p class="coll">달성한 결말 ('+Object.keys(got).length+'/6): '+names+'</p><button class="main" data-go="start">다른 선택으로 다시 증언하기</button>')}
function go(n){if(n==="END")ending();else scene(n)}
app.addEventListener("click",function(ev){
if(ev.target.closest("#win")||ev.target.closest("#intro-tx")){if(DONE)finish();return}
var b=ev.target.closest("button");if(!b)return;var d=b.dataset;
if(d.pg){PG.i++;showPage();return}
if(d.stage){showChoices();return}
if(d.cont){go(NX);return}
if(d.go==="start"){start();return}
if(d.go){drone();SFX.pick();scene(d.go);return}
var c=SC[d.id].c[+d.i],o=c[3]||{};SFX.pick();
for(var k in c[1])S[k]+=c[1][k];mood(.025+Math.min(S.lure,8)*.004);
if(o.r)R=o.r;
if(d.id==="fin")last=+d.i;
historyLogs.push({when:SC[d.id].w,choice:c[0]});
NX=c[2];var rx=REACT[d.id]&&REACT[d.id][+d.i];
if(rx)render("서사의 흐름",rx,'<button class="main" data-cont="1">다음 순간으로</button>');else go(NX)});
document.getElementById("mute").onclick=function(){MUTE=!MUTE;this.textContent=MUTE?"소리 끔":"소리 켬";if(!MUTE){drone();mood(.03)}else if(DRONE)DRONE.gain.value=0};
document.addEventListener("click",function(ev){if(DONE&&!ev.target.closest("button"))finish()});
start();
</script>
</body>
</html>
